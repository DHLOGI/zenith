<!DOCTYPE html>
<html>
<head>
    <title>Zenith Airlines Redirect</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #0F172A; color: white; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #38BDF8; border-radius: 50%; width: 40px; height: 40px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>Zenith Airlines</h1>
    <div class="loader"></div>
    <p>Redirigiendo a la aplicación...</p>
    <script>
        window.onload = function() {
            setTimeout(function() {
                // Redirige manteniendo los parámetros que mandó Discord (?code=...)
                window.location.href = "zenithauth://discord" + window.location.search;
            }, 500);
        };
    </script>
</body>
</html>
