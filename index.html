<!DOCTYPE html>
<html>
<head>
    <title>Zenith Airlines Redirect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 80px; background: #0F172A; color: white; }
        .btn { background: #38BDF8; color: #0F172A; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block; margin-top: 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Zenith Airlines</h1>
    <p>Autenticación con Discord exitosa.</p>
    <p>Pulsa el botón para regresar a la app:</p>
    <a id="openAppBtn" class="btn" href="#">Abrir Aplicación</a>

    <script>
        // Construye la URL con los parámetros que mandó Discord (?code=...)
        const customSchemeUrl = "zenithauth://discord" + window.location.search;
        document.getElementById("openAppBtn.href = customSchemeUrl;

        // Intento automático por si el navegador lo permite
        window.location.href = customSchemeUrl;
    </script>
</body>
</html>
